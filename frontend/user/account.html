<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Accounts | VaultCore Banking</title>

<style>
body{
background:linear-gradient(135deg,#F8F6F2,#E7DED3);
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
margin:0;
color:#20262E;
}
.container{
width:90%;
max-width:1100px;
margin:30px auto;
background:#fff;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(90,101,114,.12);
border:1px solid #E7DED3;
}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:25px 0;}
.nav button{width:100%;height:42px;background:#5A6572;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.3s;}
.nav button:hover{background:#20262E;transform:translateY(-2px);}
.logout{background:#8A1538!important;}
.logout:hover{background:#B1124D!important;}
fieldset{border:2px solid #E7DED3;border-radius:12px;padding:20px;margin-bottom:25px;}
legend{background:#D4AF37;color:#20262E;padding:6px 15px;border-radius:20px;font-weight:bold;font-size:13px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:12px;border:1px solid #E7DED3;}
th{background:#F8F6F2;}
.balance{color:#8A1538;font-weight:bold;}
.action-btn{background:#8A1538;color:white;padding:10px 18px;border:none;border-radius:8px;cursor:pointer;margin:8px;}
.action-btn:hover{background:#B1124D;}
.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
.account-card{background:#FFFEFC;border:2px solid #E7DED3;border-radius:14px;padding:20px;text-align:left;cursor:pointer;transition:.2s;color:#20262E;font:inherit;}
.account-card:hover{border-color:#D4AF37;transform:translateY(-2px);box-shadow:0 8px 18px rgba(90,101,114,.12);}
.account-card.selected{border-color:#8A1538;background:#FFF8FA;box-shadow:0 6px 16px rgba(138,21,56,.14);}
.account-card-head{display:flex;justify-content:space-between;gap:12px;align-items:start;}.account-number{color:#5A6572;font-size:14px;margin-top:5px;}.account-balance{color:#8A1538;font-size:25px;font-weight:800;margin:20px 0 8px;}
.status{display:inline-block;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700;}.status.active{background:#DCFCE7;color:#15803D;}.status.locked{background:#FEF3C7;color:#92400E;}
.detail-title{color:#8A1538;margin:0 0 5px;}.detail-note{color:#5A6572;margin:0 0 20px;}.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:#F8F6F2;padding:16px;border-radius:10px;}.details-grid div{padding:6px;}.details-grid span{display:block;color:#5A6572;font-size:12px;margin-bottom:4px;}.details-grid strong{font-size:14px;}
.transaction-list{margin-top:20px;border:1px solid #E7DED3;border-radius:10px;overflow:hidden;}.transaction-row{display:flex;justify-content:space-between;gap:15px;padding:13px;border-bottom:1px solid #E7DED3;font-size:14px;}.transaction-row:last-child{border-bottom:0;}.credit{color:#15803D;font-weight:700;}.debit{color:#8A1538;font-weight:700;}
@media(max-width:550px){.details-grid{grid-template-columns:1fr;}.transaction-row{align-items:flex-start;flex-direction:column;gap:4px;}}
.nav{display:none;}
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;box-sizing:border-box;background:#20262E;padding:24px 16px;display:flex;flex-direction:column;color:#fff;z-index:10;}.brand{display:flex;align-items:center;gap:10px;padding:0 12px 28px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:20px;text-decoration:none;color:#fff;}.brand-mark{background:#8A1538;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-weight:800;}.brand strong,.brand small{display:block;}.brand small{color:#D4AF37;font-size:10px;letter-spacing:1px;}.side-nav{display:flex;flex:1;flex-direction:column;gap:7px;}.side-nav a{color:#d9dce0;text-decoration:none;padding:12px;border-radius:8px;font-size:14px;font-weight:600;transition:background .2s,color .2s;}.side-nav a:hover{background:#5A6572;color:#fff;}.side-nav a.active{background:#8A1538;color:#fff;box-shadow:0 4px 12px rgba(138,21,56,.3);}.side-nav .logout-link{margin-top:auto;color:#fff;border:1px solid rgba(255,255,255,.2);}.side-nav .logout-link:hover{background:#8A1538;}body{padding-left:250px;box-sizing:border-box;}.container{width:calc(100% - 60px);}@media(max-width:800px){body{padding-left:76px;}.sidebar{width:76px;padding:18px 10px;}.brand{padding:0 10px 22px;justify-content:center;}.brand-text,.side-nav .label{display:none;}.side-nav a{text-align:center;padding:12px 6px;}.container{width:calc(100% - 30px);padding:25px;}}
</style>

<script src="api.js"></script><script>VaultCoreApi.requireAuthentication();</script></head>
<body>

<aside class="sidebar"><a class="brand" href="user_dashboard.html"><span class="brand-mark">V</span><span class="brand-text"><strong>VAULTCORE</strong><small>BANKING SYSTEM</small></span></a><nav class="side-nav"><a href="user_dashboard.html">🏠 <span class="label">Home</span></a><a href="profile.html">👤 <span class="label">Profile</span></a><a class="active" href="account.html">🏦 <span class="label">Accounts</span></a><a href="transactions.html">📜 <span class="label">Transactions</span></a><a href="support.html">📞 <span class="label">Support</span></a><a class="logout-link" href="index.html">🚪 <span class="label">Logout</span></a></nav></aside>

<div class="container">

<h1 style="color:#8A1538;text-align:center;">VAULTCORE <span style="color:#D4AF37;">BANKING</span></h1>
<h2 style="text-align:center;color:#5A6572;">My Accounts</h2>

<div class="nav">
<a href="user_dashboard.html"><button>🏠 Home</button></a>
<a href="profile.html"><button>👤 Profile</button></a>
<a href="account.html"><button>🏦 Accounts</button></a>
<a href="transactions.html"><button>📜 Transactions</button></a>
<a href="support.html"><button>📞 Support</button></a>
<a href="index.html"><button class="logout">🚪 Logout</button></a>
</div>

<fieldset>
<legend>MY ACCOUNTS</legend>
<p style="margin-top:0;color:#5A6572;">Select an account to view its complete details.</p>
<p id="accountMessage" role="status" style="color:#5A6572;">Loading accounts...</p>
<div id="accountCards" class="account-grid"></div>

</fieldset>

<fieldset>
<legend>ACCOUNT DETAILS</legend>
<h3 id="detailTitle" class="detail-title"></h3>
<p id="detailNote" class="detail-note"></p>
<div id="accountDetails"></div>
<div id="recentTransactions" class="transaction-list"></div>

<br>

<center>
<a href="open_account.html" class="action-btn" style="text-decoration:none;display:inline-block;">Open New Account</a>
</center>

</fieldset>

<p style="text-align:center;color:#5A6572;">© 2026 VaultCore Banking Management System</p>

</div>

<script>
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[char]);
const money = value => `₹${Number(value || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;
const date = value => value ? new Date(value).toLocaleDateString() : '—';
const message = document.getElementById('accountMessage');
const cards = document.getElementById('accountCards');

function showTransactions(account) {
  const title = document.getElementById('detailTitle');
  const note = document.getElementById('detailNote');
  const details = document.getElementById('accountDetails');
  const transactions = document.getElementById('recentTransactions');
  document.querySelectorAll('.account-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.id === String(account.accountId));
  });
  title.textContent = `${account.accountType} · ${account.accountNumber}`;
  note.textContent = 'Account details and transaction history';
  details.innerHTML = `<div class="details-grid">
    ${[['Account ID', account.accountId], ['Account Number', account.accountNumber], ['Account Type', account.accountType],
      ['Balance', money(account.balance)], ['Status', account.status], ['Created', date(account.createdAt)]]
      .map(([label, value]) => `<div><span>${label}</span><strong>${escapeHtml(value || '—')}</strong></div>`).join('')}
  </div>`;
  transactions.innerHTML = '<div class="transaction-row">Loading transaction history…</div>';
  VaultCoreApi.request(`/api/accounts/${encodeURIComponent(account.accountId)}/transactions`).then(items => {
    transactions.innerHTML = `<div style="padding:13px;background:#F8F6F2;font-weight:700;color:#8A1538;">Transaction History</div>${
      items.length ? items.map(item => `<div class="transaction-row">
        <div><strong>${escapeHtml(item.transactionType)}</strong><br><small style="color:#5A6572;">Transaction #${escapeHtml(item.transactionId)} · ${escapeHtml(date(item.transactionDate))}</small><br><small style="color:#5A6572;">${escapeHtml(item.description || '—')}</small>${item.receiverAccount ? `<br><small style="color:#5A6572;">Receiver: ${escapeHtml(item.receiverAccount)}</small>` : ''}</div>
        <span>${money(item.amount)}</span>
      </div>`).join('') : '<div class="transaction-row">No transactions for this account.</div>'
    }`;
  }).catch(error => {
    transactions.innerHTML = `<div class="transaction-row" style="color:#B1124D;">Unable to load transactions: ${escapeHtml(error.message || 'Please try again.')}</div>`;
  });
}

VaultCoreApi.request('/api/accounts/mine').then(accounts => {
  if (!accounts.length) {
    message.textContent = 'No accounts are linked to this customer.';
    document.getElementById('detailTitle').textContent = 'No account selected';
    document.getElementById('detailNote').textContent = '';
    return;
  }
  message.textContent = '';
  cards.innerHTML = accounts.map(account => `<button type="button" class="account-card" data-id="${escapeHtml(account.accountId)}">
    <div class="account-card-head"><div><strong>${escapeHtml(account.accountType)}</strong><p class="account-number">${escapeHtml(account.accountNumber)}</p></div><span class="status">${escapeHtml(account.status)}</span></div>
    <p class="account-balance">${money(account.balance)}</p><small>Created ${escapeHtml(date(account.createdAt))}</small>
  </button>`).join('');
  cards.addEventListener('click', event => {
    const card = event.target.closest('.account-card');
    if (card) showTransactions(accounts.find(account => String(account.accountId) === card.dataset.id));
  });
  const requestedId = new URLSearchParams(location.search).get('account');
  const selected = accounts.find(account => String(account.accountId) === requestedId) || accounts[0];
  showTransactions(selected);
}).catch(error => {
  message.textContent = `Unable to load accounts: ${error.message || 'Please try again.'}`;
  document.getElementById('detailTitle').textContent = 'Account information unavailable';
  document.getElementById('detailNote').textContent = '';
});
</script>

</body>
</html>

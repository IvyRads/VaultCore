<fieldset>
<legend>RECENT TRANSACTIONS</legend>
<label for="accountSelector">Account:</label>
<select id="accountSelector" aria-label="Filter transactions by account">
  <option value="">All accounts</option>
</select>

<table>
<thead>
<tr>
<th>Transaction ID</th>
<th>Account Number</th>
<th>Type</th>
<th>Amount</th>
<th>Receiver Account</th>
<th>Description</th>
<th>Date</th>
</tr>
</thead>
<tbody id="transactionRows"><tr><td colspan="7">Loading transactions…</td></tr></tbody>
</table>

<br>

<center>
<button id="downloadPdfBtn" class="action-btn" type="button" disabled>Download PDF</button>
</center>

</fieldset>

<p style="text-align:center;color:#5A6572;">© 2026 VaultCore Banking Management System</p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script>
  const transactionRows = document.getElementById('transactionRows');
  const downloadButton = document.getElementById('downloadPdfBtn');
  const accountSelector = document.getElementById('accountSelector');
  let accountSelectorInitialized = false;
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
  const displayDate = value => value ? new Date(value).toLocaleString() : '—';
  const displayType = value => {
    const type = String(value || '').toUpperCase();
    if (type === 'TRANSFER_OUT') return 'Transfer Out';
    if (type === 'TRANSFER_IN') return 'Transfer In';
    if (type === 'DEPOSIT') return 'Deposit';
    if (type === 'WITHDRAWAL') return 'Withdrawal';
    if (type === 'TRANSFER') return 'Transfer';
    return value || '—';
  };

  function downloadPdf() {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      alert('PDF library failed to load. Please refresh the page and try again.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const table = document.querySelector('table');
    const headers = Array.from(table.querySelectorAll('thead th')).map(cell => cell.textContent.trim());
    const body = Array.from(table.querySelectorAll('tbody tr[data-transaction-row]')).map(row =>
      Array.from(row.children).map(cell => cell.textContent.trim())
    );
    if (!headers.length) return;

    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(16);
    doc.setTextColor(138, 21, 56);
    doc.text('VaultCore Banking', 14, 16);
    doc.setFontSize(11);
    doc.setTextColor(32, 38, 46);
    doc.text('Transaction History', 14, 23);

    doc.autoTable({
      head: [headers],
      body: body,
      startY: 30,
      theme: 'grid',
      headStyles: {
        fillColor: [138, 21, 56],
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        halign: 'center'
      },
      bodyStyles: {
        textColor: [32, 38, 46],
        fontSize: 8
      },
      alternateRowStyles: {
        fillColor: [248, 246, 242]
      },
      margin: { left: 10, right: 10 },
      styles: { cellPadding: 3, overflow: 'linebreak', fontSize: 8 },
      columnStyles: {
        0: { cellWidth: 20 },
        1: { cellWidth: 30 },
        2: { cellWidth: 25 },
        3: { cellWidth: 22 },
        4: { cellWidth: 30 },
        5: { cellWidth: 45 },
        6: { cellWidth: 35 }
      }
    });

    doc.save('vaultcore_transactions.pdf');
  }

  async function loadTransactions() {
    try {
      const accounts = await VaultCoreApi.request('/api/accounts/mine');
      if (!accountSelectorInitialized) {
        const requestedId = new URLSearchParams(location.search).get('account');
        accountSelector.innerHTML = '<option value="">All accounts</option>' + accounts.map(account =>
          `<option value="${escapeHtml(account.accountId)}">${escapeHtml(account.accountType)} — ${escapeHtml(account.accountNumber)}</option>`
        ).join('');
        if (requestedId && accounts.some(account => String(account.accountId) === requestedId)) {
          accountSelector.value = requestedId;
        }
        accountSelectorInitialized = true;
      }
      const selectedId = accountSelector.value;
      const selectedAccounts = selectedId
        ? accounts.filter(account => String(account.accountId) === selectedId)
        : accounts;

      if (selectedId && !selectedAccounts.length) {
        transactionRows.innerHTML = '<tr><td colspan="7">The selected account is unavailable.</td></tr>';
        return;
      }
      if (!selectedAccounts.length) {
        transactionRows.innerHTML = '<tr><td colspan="7">No accounts are linked to this customer.</td></tr>';
        return;
      }

      const histories = await Promise.all(selectedAccounts.map(async account => {
        const items = await VaultCoreApi.request(`/api/accounts/${encodeURIComponent(account.accountId)}/transactions`);
        return items.map(item => ({ ...item, accountNumber: account.accountNumber }));
      }));
      const items = histories.flat().sort((left, right) =>
        new Date(right.transactionDate || 0) - new Date(left.transactionDate || 0)
      );
      if (!items.length) {
        transactionRows.innerHTML = '<tr><td colspan="7">No transactions found.</td></tr>';
        return;
      }

      transactionRows.innerHTML = items.map(item => `<tr data-transaction-row>
        <td>${escapeHtml(item.transactionId)}</td>
        <td>${escapeHtml(item.accountNumber || item.account?.accountNumber || '—')}</td>
        <td>${escapeHtml(displayType(item.transactionType))}</td>
        <td>₹${Number(item.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
        <td>${escapeHtml(item.receiverAccount || '—')}</td>
        <td>${escapeHtml(item.description || '—')}</td>
        <td>${escapeHtml(displayDate(item.transactionDate))}</td>
      </tr>`).join('');
      downloadButton.disabled = false;
    } catch (error) {
      transactionRows.innerHTML = `<tr><td colspan="7" style="color:#B1124D;">Unable to load transactions: ${escapeHtml(error.message || 'Please try again.')}</td></tr>`;
    }
  }

  accountSelector.addEventListener('change', loadTransactions);
  downloadButton.addEventListener('click', downloadPdf);
  loadTransactions();
</script>

</body>
</html>

  <title>Edit Profile | VaultCore Banking</title>
  <style>
  body{
    background:linear-gradient(135deg,#F8F6F2 0%,#E7DED3 100%);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    margin:0;color:#20262E;
  }
  .container{width:90%;max-width:1100px;margin:30px auto;background:#fff;padding:40px;border-radius:20px;box-shadow:0 10px 30px rgba(90,101,114,.12);border:1px solid #E7DED3;}
  .sidebar{position:fixed;inset:0 auto 0 0;width:250px;box-sizing:border-box;background:#20262E;padding:24px 16px;display:flex;flex-direction:column;color:#fff;z-index:10}
  .brand{display:flex;align-items:center;gap:10px;padding:0 12px 28px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:20px;text-decoration:none;color:#fff}
  .brand-mark{background:#8A1538;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-weight:800}
  .brand strong,.brand small{display:block}
  .brand small{color:#D4AF37;font-size:10px;letter-spacing:1px}
  .side-nav{display:flex;flex:1;flex-direction:column;gap:7px}
  .side-nav a{color:#d9dce0;text-decoration:none;padding:12px;border-radius:8px;font-size:14px;font-weight:600;transition:background .2s,color .2s}
  .side-nav a:hover{background:#5A6572;color:#fff}
  .side-nav a.active{background:#8A1538;color:#fff;box-shadow:0 4px 12px rgba(138,21,56,.3)}
  .side-nav .logout-link{margin-top:auto;color:#fff;border:1px solid rgba(255,255,255,.2)}
  .side-nav .logout-link:hover{background:#8A1538}
  body{padding-left:250px;box-sizing:border-box}
  .container{width:calc(100% - 60px)}
  @media(max-width:800px){body{padding-left:76px}.sidebar{width:76px;padding:18px 10px}.brand{padding:0 10px 22px;justify-content:center}.brand-text,.side-nav .label{display:none}.side-nav a{text-align:center;padding:12px 6px}.container{width:calc(100% - 30px);padding:25px}}

  h1{color:#8A1538;text-align:center}
  h2{ text-align:center;color:#5A6572 }

  fieldset{border:2px solid #E7DED3;border-radius:12px;margin-bottom:25px;padding:20px}
  legend{background:#8A1538;color:#fff;padding:6px 15px;border-radius:20px;font-size:13px;font-weight:bold}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px;border:1px solid #E7DED3;text-align:left}
  th{background:#F8F6F2}

  .action-btn{background:#8A1538;color:white;padding:10px 18px;border:none;border-radius:8px;cursor:pointer;margin:8px;font-weight:600}
  .action-btn:hover{background:#B1124D}

  /* form control styles to match visual style */
  .form-row{display:flex;gap:12px;align-items:center}
  .form-row label{width:180px;font-weight:600}
  .form-control{flex:1;padding:10px;border:1px solid #E7DED3;border-radius:8px;background:#fff}
  .form-control[disabled]{background:#F8F6F2;color:#6b6b6b}
  .note-lock{color:#9aa0a6;margin-left:8px}
  .error{color:#b1124d;font-size:13px;margin-top:6px}
  .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:8px}
  </style>
<script src="../api.js"></script><script>VaultCoreApi.requireAuthentication();</script></head>
<body>
  <aside class="sidebar"><a class="brand" href="../user_dashboard.html"><span class="brand-mark">V</span><span class="brand-text"><strong>VAULTCORE</strong><small>BANKING SYSTEM</small></span></a><nav class="side-nav"><a href="../user_dashboard.html">🏠 <span class="label">Home</span></a><a class="active" href="profile.html">👤 <span class="label">Profile</span></a><a href="../account.html">🏦 <span class="label">Accounts</span></a><a href="../transactions.html">📜 <span class="label">Transactions</span></a><a href="../support.html">📞 <span class="label">Support</span></a><a class="logout-link" href="../../index.html">🚪 <span class="label">Logout</span></a></nav></aside>


  <div class="container">

  <h1>VAULTCORE <span style="color:#D4AF37;">BANKING</span></h1>
  <h2>Edit Customer Profile</h2>

  <form id="editProfileForm">

  <fieldset>
    <legend>PERSONAL INFORMATION</legend>

    <div class="form-row">
      <label>First Name</label>
      <input id="firstName" name="firstName" class="form-control" type="text" required />
    </div>
    <div class="form-row" style="margin-top:10px">
      <label>Last Name</label>
      <input id="lastName" name="lastName" class="form-control" type="text" required />
    </div>
    <div class="form-row" style="margin-top:10px">
      <label>Date of Birth</label>
      <input id="dob" name="dob" class="form-control" type="date" />
    </div>

    <div class="form-row" style="margin-top:10px">
      <label>Gender</label>
      <select id="gender" name="gender" class="form-control" required>
        <option value="">Select gender</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div id="genderError" class="error" style="display:none"></div>

  </fieldset>

  <fieldset>
    <legend>CONTACT INFORMATION</legend>

    <div class="form-row">
      <label>Mobile</label>
      <input id="phone" name="phone" class="form-control" type="tel" required />
    </div>
    <div id="phoneError" class="error" style="display:none"></div>

    <div class="form-row" style="margin-top:10px">
      <label>Email</label>
      <input id="email" name="email" class="form-control" type="email" readonly />
    </div>

    <div class="form-row" style="margin-top:10px;align-items:flex-start">
      <label>Address</label>
      <textarea id="address" name="address" class="form-control" rows="3" required></textarea>
    </div>
    <div id="addressError" class="error" style="display:none"></div>

  </fieldset>

  <p id="formMessage" role="status" class="error" style="display:none"></p>
  <div class="actions">
    <button type="button" id="cancelBtn" class="action-btn" style="background:#fff;color:#20262E;border:1px solid #E7DED3">Cancel</button>
    <button type="submit" id="saveBtn" class="action-btn">Save Changes</button>
  </div>

  </form>

  <p style="text-align:center;color:#5A6572;">© 2026 VaultCore Banking Management System</p>

  </div>

  </div>

  <script>
    const form = document.getElementById('editProfileForm');
    const message = document.getElementById('formMessage');
    const user = VaultCoreApi.getUser() || {};
    document.getElementById('email').value = user.email || '';
    VaultCoreApi.request('/api/customers/me/profile').then(profile => {
      ['firstName', 'lastName', 'phone', 'gender', 'address'].forEach(field => {
        document.getElementById(field).value = profile[field] || '';
      });
      document.getElementById('dob').value = profile.dob || '';
    }).catch(error => {
      message.style.display = 'block';
      message.textContent = `Unable to load profile: ${error.message || 'Please try again.'}`;
    });
    document.getElementById('cancelBtn').addEventListener('click', () => {
      window.location.href = 'profile.html';
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      message.style.display = 'block';
      message.style.color = '#5A6572';
      message.textContent = 'Saving profile...';
      document.getElementById('saveBtn').disabled = true;
      const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        dob: document.getElementById('dob').value || null,
        gender: document.getElementById('gender').value,
        address: document.getElementById('address').value.trim()
      };
      try {
        await VaultCoreApi.request('/api/customers/me/profile', {
          method: 'PUT',
          body: JSON.stringify(payload)
        });
        message.style.color = '#15803d';
        message.textContent = 'Profile updated successfully.';
      } catch (error) {
        message.style.color = '#b1124d';
        message.textContent = `Unable to update profile: ${error.message || 'Please try again.'}`;
      } finally {
        document.getElementById('saveBtn').disabled = false;
      }
    });
  </script>
</body>
</html>

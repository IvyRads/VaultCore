<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Management System - Login</title>
</head>
<body>

    <center>
        <h1>🏦 VAULTCORE Banking Management System</h1>

        <h2>LOGIN</h2>

        <form>
            <table>

                <tr>
                    <td><label>Login As:</label></td>
                    <td>
                        <input type="radio" name="role" value="Admin" required> Admin
                        <input type="radio" name="role" value="User"> User
                    </td>
                </tr>

                <tr>
                    <td><label>Email / Username:</label></td>
                    <td>
                        <input type="text" name="username" placeholder="Enter Email or Username" required>
                    </td>
                </tr>

                <tr>
                    <td><label>Password:</label></td>
                    <td>
                        <input type="password" name="password" placeholder="Enter Password" required>
                    </td>
                    <td>
                        <a href="forgot_password.html">Forgot Password?</a>
                    </td>
                </tr>

                <tr>
                    <td colspan="3" align="center">
                        <br>
                        <input type="submit" value="Login">
                    </td>
                </tr>

            </table>
        </form>

    </center>

</body>
</html>
